{% extends "base.html" %}{% block title %}Đăng nhập{% endblock %}
{% block content %}
<section class="box" style="max-width:420px;margin:48px auto">
  <h1>Tend · Tân Cổ Điển</h1>
  {% if form.errors %}<p class="bad" role="alert">Sai tên đăng nhập hoặc mật khẩu.</p>{% endif %}
  <form method="post">{% csrf_token %}
    <p><label>Tên đăng nhập<br><input type="text" name="username" autocomplete="username" required autofocus></label></p>
    <p><label>Mật khẩu<br><input type="password" name="password" autocomplete="current-password" required></label></p>
    <p><button class="btn" type="submit">Đăng nhập</button></p>
  </form>
</section>
{% endblock %}
